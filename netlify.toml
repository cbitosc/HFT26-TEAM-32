# ══════════════════════════════════════════════════════════════════════
# NETLIFY CONFIGURATION FOR PROCTOR-FORGE (Next.js 14 Monorepo)
# ══════════════════════════════════════════════════════════════════════

[build]
  base = "."
  command = "pnpm --filter @proctor-forge/shared build && pnpm --filter @proctor-forge/task-bank build && pnpm --filter @proctor-forge/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"
  NEXT_TELEMETRY_DISABLED = "1"
  SECRETS_SCAN_ENABLED = "false"

# Official Netlify Next.js Runtime Plugin for App Router & API Routes
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security & CORS Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=*"

# Static Asset Caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

