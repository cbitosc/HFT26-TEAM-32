version: '3.8'

services:
  # Runner Service executing untrusted candidate code in sandboxes
  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    container_name: proctor-forge-runner
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - RUNNER_HMAC_SECRET=c8f6e4a2b91d4e7a9b0c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Local Firebase Emulator Suite for dev
  firebase-emulators:
    image: spine3/firebase-tools:latest
    container_name: proctor-forge-firebase
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
      - "9199:9199" # Storage
    volumes:
      - ./firebase.json:/app/firebase.json
      - ./firestore.rules:/app/firestore.rules
      - ./storage.rules:/app/storage.rules
    working_dir: /app
    command: ["firebase", "emulators:start", "--project", "proctor-forge"]

